<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cough Counter — Live Sync Overlay</title>
  <style>

:root{
  --bg:#000;--panel:rgba(255,255,255,.04);--panel-solid:#111;
  --border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.16);
  --fg:#f5f5f7;--muted:#a1a1a6;--subtle:#6e6e73;
  --primary:#f5f5f7;--accent:#2997ff;--danger:#ff453a;--ok:#30d158;
  --shadow:0 20px 50px rgba(0,0,0,.45);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --radius:18px;--radius-sm:12px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font);color:var(--fg);background:var(--bg);
  -webkit-font-smoothing:antialiased;line-height:1.47;letter-spacing:-.011em;
}
body:not(.overlay-mode){
  background:
    radial-gradient(ellipse 90% 50% at 50% -20%,rgba(41,151,255,.14),transparent 55%),
    #000;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 96px}
.app-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.brand h1{margin:0 0 8px;font-size:clamp(1.75rem,4vw,2.25rem);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.brand p{margin:0;color:var(--muted);max-width:52ch;font-size:15px;line-height:1.5;font-weight:400}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:7px 12px;border-radius:980px;border:1px solid var(--border);background:var(--panel);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.grid{grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 20px;transition:border-color .25s var(--ease),background .25s var(--ease);
}
.card:hover{border-color:var(--border-strong)}
.card h2{margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row+.row{margin-top:12px}
.btn{
  appearance:none;border:0;cursor:pointer;border-radius:980px;padding:11px 16px;
  font-weight:500;font-size:14px;font-family:inherit;letter-spacing:-.01em;
  background:var(--primary);color:#000;transition:transform .15s var(--ease),opacity .15s var(--ease),background .15s var(--ease);
  min-height:40px;
}
.btn:hover{opacity:.92}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
.btn.ghost:hover{background:rgba(255,255,255,.06);opacity:1}
.btn.ok{background:var(--ok);color:#00210b}.btn.danger{background:var(--danger);color:#fff}
.btn.accent{background:var(--accent);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;min-height:34px}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.warn{font-size:13px;color:#ffd60a;background:rgba(255,214,10,.08);border:1px solid rgba(255,214,10,.22);border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px;line-height:1.45}
.okbox{font-size:13px;color:#30d158;background:rgba(48,209,88,.08);border:1px solid rgba(48,209,88,.22);border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px;line-height:1.45}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stat{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;background:rgba(0,0,0,.35);text-align:center}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);font-weight:600}
.stat .v{font-size:clamp(1.35rem,3.5vw,1.85rem);font-weight:600;margin-top:6px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-count{text-align:center;padding:20px 10px 10px}
.big-count .label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)}
.big-count .num{font-size:clamp(4rem,14vw,6.5rem);font-weight:600;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.meter{height:8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);overflow:hidden}
.meter>i{display:block;height:100%;width:0%;background:var(--accent);border-radius:999px;transition:width .15s linear}
.meter-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--subtle);font-weight:500}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:980px;border:1px solid var(--border);color:var(--muted);background:rgba(0,0,0,.25)}
.status-pill.on{color:#30d158;border-color:rgba(48,209,88,.35);background:rgba(48,209,88,.1)}
.status-pill.hot{color:#ff9f0a;border-color:rgba(255,159,10,.35);background:rgba(255,159,10,.1)}
.status-pill.sync{color:#64d2ff;border-color:rgba(100,210,255,.35);background:rgba(100,210,255,.1)}
.url-box{width:100%;min-height:72px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(0,0,0,.4);color:var(--fg);padding:12px 14px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--subtle);letter-spacing:.02em}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field input[type=text],.field input[type=number]{
  height:42px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:rgba(0,0,0,.4);color:var(--fg);padding:0 12px;font:14px var(--font);outline:none;
  transition:border-color .2s var(--ease);
}
.field input:focus{border-color:rgba(41,151,255,.5)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--fg);color:#000;padding:12px 18px;border-radius:980px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:50;font-weight:600;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.log{max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:rgba(0,0,0,.4);padding:10px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
.log div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}.log div:last-child{border-bottom:0}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:14px;font-weight:500;color:var(--fg)}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.room-code{font:600 1.05rem/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.03em;color:var(--accent)}
.note{font-size:12px;color:var(--subtle);margin-top:8px;line-height:1.45}
.ov{min-height:100vh;display:grid;place-items:end start;padding:24px;background:transparent}
.ov-card{min-width:220px;max-width:min(420px,92vw);padding:16px 18px 14px;border-radius:20px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 16px 40px rgba(0,0,0,.4);color:#fff;user-select:none}
.ov-card.flash{animation:coughPulse .45s var(--ease)}
@keyframes coughPulse{0%{transform:scale(1)}35%{transform:scale(1.03);box-shadow:0 0 28px rgba(41,151,255,.35)}100%{transform:scale(1)}}
.ov-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.ov-count{font-size:clamp(2.8rem,8vw,4.2rem);font-weight:600;letter-spacing:-.05em;line-height:1;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.ov-meta{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,.7)}.ov-meta b{color:#fff;font-weight:600}
.ov-hint{margin-top:8px;font-size:11px;color:rgba(255,255,255,.5);font-weight:500}
@media(prefers-reduced-motion:reduce){
  .btn,.card,.toast,.ov-card{transition:none!important;animation:none!important}
}

/* RESPONSIVE-POLISH */

html { overflow-x: clip; -webkit-text-size-adjust: 100%; }
body { overflow-x: clip; min-height: 100dvh; }
.wrap {
  padding: 20px 16px max(72px, calc(48px + env(safe-area-inset-bottom)));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}
@media (min-width: 640px) {
  .wrap { padding: 28px 20px 96px; }
}
.app-head { gap: 12px; margin-bottom: 20px; }
.brand h1 { font-size: clamp(1.55rem, 5.5vw, 2.25rem); }
.brand p { font-size: 14px; }
.stat-grid { gap: 8px; }
@media (max-width: 420px) {
  .stat-grid { grid-template-columns: 1fr; }
  .stat { display: flex; align-items: center; justify-content: space-between; text-align: left; padding: 12px 14px; }
  .stat .v { margin-top: 0; font-size: 1.35rem; }
  .big-count .num { font-size: clamp(3.2rem, 18vw, 5rem); }
  .row .btn { flex: 1 1 calc(50% - 8px); justify-content: center; text-align: center; }
  .row .btn.ghost.sm { flex: 1 1 auto; }
}
.btn { min-height: 44px; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; }
.btn.sm { min-height: 36px; }
.field input[type=text], .field input[type=number], .url-box { font-size: 16px; } /* prevent iOS zoom */
@media (min-width: 860px) {
  .grid { position: relative; }
  .grid > .card:last-child { position: sticky; top: 16px; }
}
.ov { padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.card { padding: 18px 16px; }
@media (min-width: 640px) { .card { padding: 22px 20px; } }

/* END-RESPONSIVE-POLISH */
</style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <script>




(function () {
  var STORE = 'cough-counter-v3';
  // Free host rate-limits aggressive polling. We publish rarely; overlay polls slowly.
  var SYNC_BASE = 'https://jsonblob.com/api/jsonBlob';
  var OVERLAY_POLL_MS = 3000;
  var BACKOFF_MS = 15000;

  var state = {
    mode: 'control',
    room: '',
    count: 0,
    sensitivity: 58,
    cooldown: 1200,
    auto: false,
    label: 'COUGHS',
    sessionStart: Math.floor(Date.now() / 1000),
    updatedAt: 0,
    source: 'local'
  };

  var audio = {
    stream: null, ctx: null, analyser: null, data: null, timeData: null,
    raf: 0, level: 0, lastCoughAt: 0, listening: false, error: '',
    // rolling baseline for onset detection
    baseline: 8,
    peak: 0,
    aboveSince: 0,
    debug: ''
  };

  var logLines = [];
  var tickTimer = 0;
  var pollTimer = 0;
  var publishTimer = 0;
  var syncStatus = 'off'; // off | ok | wait | error
  var lastFlash = 0;
  var applyingRemote = false;
  var publishInFlight = false;
  var pendingPublishReason = null;
  var rateLimitedUntil = 0;
  var lastPublishLogAt = 0;

  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&' + 'amp;')
      .replace(/</g, '&' + 'lt;')
      .replace(/>/g, '&' + 'gt;')
      .replace(/"/g, '&' + 'quot;');
  }

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(STORE) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function saveLocal() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        room: state.room,
        count: state.count,
        sensitivity: state.sensitivity,
        cooldown: state.cooldown,
        auto: state.auto,
        label: state.label,
        sessionStart: state.sessionStart,
        updatedAt: state.updatedAt
      }));
    } catch (e) {}
  }

  function readUrlIntoState() {
    var p = new URLSearchParams(location.search);
    var local = loadLocal();
    state.mode = p.get('mode') === 'overlay' ? 'overlay' : 'control';
    state.room = (p.get('room') || local.room || '').trim();

    var count = parseInt(p.get('count') || '', 10);
    if (!Number.isFinite(count)) count = Number.isFinite(local.count) ? local.count : 0;
    state.count = Math.max(0, Math.floor(count));

    var sensitivity = parseInt(p.get('sensitivity') || p.get('sens') || '', 10);
    if (!Number.isFinite(sensitivity)) sensitivity = Number.isFinite(local.sensitivity) ? local.sensitivity : 58;
    state.sensitivity = Math.min(95, Math.max(15, sensitivity));

    var cooldown = parseInt(p.get('cooldown') || '', 10);
    if (!Number.isFinite(cooldown)) cooldown = Number.isFinite(local.cooldown) ? local.cooldown : 1200;
    state.cooldown = Math.min(4000, Math.max(500, cooldown));

    var auto = p.get('auto');
    if (auto == null) state.auto = !!local.auto;
    else state.auto = auto === '1' || auto === 'true';

    state.label = (p.get('label') || local.label || 'COUGHS').trim().slice(0, 18) || 'COUGHS';

    var sessionStart = parseInt(p.get('sessionStart') || '', 10);
    if (!Number.isFinite(sessionStart) || sessionStart < 1000000000) {
      sessionStart = Number.isFinite(local.sessionStart) ? local.sessionStart : Math.floor(Date.now() / 1000);
    }
    state.sessionStart = sessionStart;
    state.updatedAt = Number(local.updatedAt) || 0;
  }

  function writeUrl() {
    var u = new URL(location.href);
    if (state.mode === 'overlay') u.searchParams.set('mode', 'overlay');
    else u.searchParams.delete('mode');
    if (state.room) u.searchParams.set('room', state.room);
    else u.searchParams.delete('room');
    u.searchParams.set('count', String(state.count));
    u.searchParams.set('sensitivity', String(state.sensitivity));
    u.searchParams.set('cooldown', String(state.cooldown));
    u.searchParams.set('auto', state.auto ? '1' : '0');
    u.searchParams.set('label', state.label);
    u.searchParams.set('sessionStart', String(state.sessionStart));
    history.replaceState(null, '', u);
    saveLocal();
  }

  function formatDuration(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function coughsPerHour(count, sessionStart) {
    var hours = Math.max(1 / 60, (Date.now() / 1000 - sessionStart) / 3600);
    return (count / hours).toFixed(1);
  }

  function pushLog(msg) {
    var t = new Date().toLocaleTimeString();
    logLines.unshift(t + '  ' + msg);
    if (logLines.length > 40) logLines.pop();
    var box = document.getElementById('eventLog');
    if (box) {
      box.innerHTML = logLines.map(function (l) {
        return '<div>' + escapeHtml(l) + '</div>';
      }).join('');
    }
  }

  function payload() {
    return {
      count: state.count,
      label: state.label,
      sessionStart: state.sessionStart,
      updatedAt: state.updatedAt,
      source: state.source
    };
  }

  function updateSyncPill() {
    var el = document.getElementById('syncPill');
    if (!el) return;
    if (!state.room) {
      el.textContent = 'Sync off';
      el.className = 'status-pill';
      return;
    }
    if (Date.now() < rateLimitedUntil || syncStatus === 'wait') {
      el.textContent = 'Sync pause';
      el.className = 'status-pill';
      return;
    }
    if (syncStatus === 'ok') {
      el.textContent = 'Live sync';
      el.className = 'status-pill sync';
    } else if (syncStatus === 'publishing') {
      el.textContent = 'Syncing…';
      el.className = 'status-pill sync';
    } else if (syncStatus === 'error') {
      el.textContent = 'Sync error';
      el.className = 'status-pill hot';
    } else {
      el.textContent = 'Room ready';
      el.className = 'status-pill sync';
    }
  }

  
  function endRoom() {
    if (!state.room) {
      toast('No active room');
      return;
    }
    if (!confirm('End live room? OBS will stop receiving updates until you create a new room.')) return;
    var old = state.room;
    state.room = '';
    rateLimitedUntil = 0;
    publishInFlight = false;
    pendingPublishReason = null;
    syncStatus = 'off';
    clearInterval(pollTimer);
    pollTimer = 0;
    clearTimeout(publishTimer);
    writeUrl();
    pushLog('Live room ended (' + old.slice(0, 8) + '…)');
    toast('Room ended');
    render();
  }

  async function createRoom() {
    syncStatus = 'publishing';
    updateSyncPill();
    try {
      state.updatedAt = Date.now();
      state.source = 'control';
      var res = await fetch(SYNC_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload())
      });
      if (res.status === 429) {
        rateLimitedUntil = Date.now() + BACKOFF_MS;
        syncStatus = 'wait';
        pushLog('Host busy (429). Wait ~15s then try Create room again.');
        updateSyncPill();
        toast('Host rate-limited — wait 15s');
        return '';
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var loc = res.headers.get('Location') || res.headers.get('location') || '';
      var id = res.headers.get('X-jsonblob-id') || '';
      if (!id && loc) id = loc.split('/').pop();
      if (!id && res.url && res.url.indexOf('/jsonBlob/') >= 0) id = res.url.split('/').pop();
      if (!id) throw new Error('No room id returned');
      state.room = id;
      rateLimitedUntil = 0;
      writeUrl();
      syncStatus = 'ok';
      pushLog('Live room created — only count changes are synced (saves rate limit)');
      toast('Live room ready');
      // Control does not poll. Overlay will poll.
      render();
      // one quiet verify GET after a delay
      setTimeout(function () { pullRemote(true); }, 1200);
      return id;
    } catch (err) {
      syncStatus = 'error';
      pushLog('Room create failed: ' + ((err && err.message) || err));
      toast('Could not create live room');
      updateSyncPill();
      return '';
    }
  }

  async function publishNow(reason) {
    if (!state.room || applyingRemote) return;
    if (Date.now() < rateLimitedUntil) {
      pendingPublishReason = reason || pendingPublishReason || 'retry';
      syncStatus = 'wait';
      updateSyncPill();
      return;
    }
    if (publishInFlight) {
      pendingPublishReason = reason || pendingPublishReason || 'queued';
      return;
    }
    publishInFlight = true;
    syncStatus = 'publishing';
    updateSyncPill();
    try {
      // bump timestamp only when we actually send
      if (!state.updatedAt) state.updatedAt = Date.now();
      var res = await fetch(SYNC_BASE + '/' + encodeURIComponent(state.room), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload())
      });
      if (res.status === 429) {
        rateLimitedUntil = Date.now() + BACKOFF_MS;
        syncStatus = 'wait';
        pendingPublishReason = reason || 'retry';
        var now = Date.now();
        if (now - lastPublishLogAt > 10000) {
          lastPublishLogAt = now;
          pushLog('Sync paused 15s (host rate limit). Count is safe locally.');
        }
        updateSyncPill();
        // retry once after backoff
        setTimeout(function () {
          if (pendingPublishReason) {
            var r = pendingPublishReason;
            pendingPublishReason = null;
            publishNow(r);
          }
        }, BACKOFF_MS + 200);
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      syncStatus = 'ok';
      rateLimitedUntil = 0;
      if (reason && reason.indexOf('cough') >= 0) {
        pushLog('Synced to OBS (' + reason + ') count=' + state.count);
      }
    } catch (err) {
      syncStatus = 'error';
      var now2 = Date.now();
      if (now2 - lastPublishLogAt > 8000) {
        lastPublishLogAt = now2;
        pushLog('Sync publish failed: ' + ((err && err.message) || err));
      }
    } finally {
      publishInFlight = false;
      updateSyncPill();
      var urlBox = document.getElementById('urlBox');
      if (urlBox) urlBox.value = obsUrl();
      if (pendingPublishReason && Date.now() >= rateLimitedUntil) {
        var r2 = pendingPublishReason;
        pendingPublishReason = null;
        setTimeout(function () { publishNow(r2); }, 400);
      }
    }
  }

  function schedulePublish(reason) {
    if (!state.room) return;
    state.updatedAt = Date.now();
    clearTimeout(publishTimer);
    // short debounce for rapid +1 spam, still coalesces
    publishTimer = setTimeout(function () { publishNow(reason || 'update'); }, 200);
  }

  async function pullRemote(quiet) {
    if (!state.room) return;
    if (Date.now() < rateLimitedUntil) {
      syncStatus = 'wait';
      updateSyncPill();
      return;
    }
    try {
      var res = await fetch(SYNC_BASE + '/' + encodeURIComponent(state.room), {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        cache: 'no-store'
      });
      if (res.status === 429) {
        rateLimitedUntil = Date.now() + BACKOFF_MS;
        syncStatus = 'wait';
        updateSyncPill();
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      syncStatus = 'ok';
      updateSyncPill();
      if (!data || typeof data !== 'object') return;

      var remoteAt = Number(data.updatedAt) || 0;
      // Overlay should always apply newer remote counts
      if (remoteAt && remoteAt <= state.updatedAt && state.mode === 'control') return;

      var prev = state.count;
      applyingRemote = true;
      if (Number.isFinite(data.count)) state.count = Math.max(0, Math.floor(data.count));
      if (data.label) state.label = String(data.label).slice(0, 18);
      if (Number.isFinite(data.sessionStart) && data.sessionStart > 1000000000) state.sessionStart = data.sessionStart;
      if (remoteAt > state.updatedAt) state.updatedAt = remoteAt;
      writeUrl();
      applyingRemote = false;

      if (state.count !== prev) {
        lastFlash = Date.now();
        if (!quiet) pushLog('Remote update → ' + state.count);
      }
      paintLiveNumbers();
      if (state.mode === 'overlay') renderOverlay();
    } catch (err) {
      if (!quiet) {
        syncStatus = 'error';
        updateSyncPill();
      }
    }
  }

  function startPolling() {
    clearInterval(pollTimer);
    // Only overlay polls. Control only publishes on count changes.
    if (!state.room || state.mode !== 'overlay') return;
    pollTimer = setInterval(function () { pullRemote(true); }, OVERLAY_POLL_MS);
    setTimeout(function () { pullRemote(true); }, 400);
  }

  function stopMic() {
    if (audio.raf) cancelAnimationFrame(audio.raf);
    audio.raf = 0;
    if (audio.stream) audio.stream.getTracks().forEach(function (t) { t.stop(); });
    if (audio.ctx && audio.ctx.state !== 'closed') {
      try { audio.ctx.close(); } catch (e) {}
    }
    audio.stream = null;
    audio.ctx = null;
    audio.analyser = null;
    audio.data = null;
    audio.listening = false;
    audio.level = 0;
  }

  async function startMic() {
    audio.error = '';
    try {
      stopMic();
      var stream = await navigator.mediaDevices.getUserMedia({
        // noiseSuppression/echoCancellation often erase short coughs — keep them off
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: true,
          channelCount: 1
        },
        video: false
      });
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        try { await ctx.resume(); } catch (e) {}
      }
      var source = ctx.createMediaStreamSource(stream);
      var analyser = ctx.createAnalyser();
      // faster response for short bursts
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.35;
      source.connect(analyser);
      audio.stream = stream;
      audio.ctx = ctx;
      audio.analyser = analyser;
      audio.data = new Uint8Array(analyser.frequencyBinCount);
      audio.timeData = new Uint8Array(analyser.fftSize);
      audio.baseline = 8;
      audio.peak = 0;
      audio.aboveSince = 0;
      audio.prevLevel = 0;
      audio.listening = true;
      pushLog('Mic enabled');
      loopAudio();
      render();
      return true;
    } catch (err) {
      audio.error = (err && err.message) || 'Mic permission denied';
      audio.listening = false;
      pushLog('Mic failed: ' + audio.error);
      render();
      return false;
    }
  }

  function loopAudio() {
    if (!audio.analyser || !audio.data) return;
    audio.analyser.getByteFrequencyData(audio.data);
    if (audio.timeData) audio.analyser.getByteTimeDomainData(audio.timeData);

    var data = audio.data;
    var sampleRate = audio.ctx.sampleRate || 48000;
    var binHz = sampleRate / (audio.analyser.fftSize || 1024);

    // Waveform peak + RMS
    var rms = 0;
    var peakWave = 0;
    if (audio.timeData) {
      var td = audio.timeData;
      var sum = 0;
      for (var t = 0; t < td.length; t++) {
        var x = (td[t] - 128) / 128;
        var ax = x < 0 ? -x : x;
        if (ax > peakWave) peakWave = ax;
        sum += x * x;
      }
      rms = Math.sqrt(sum / td.length);
    }

    var low = 0, lowN = 0, mid = 0, midN = 0, high = 0, highN = 0, i, hz, v;
    for (i = 0; i < data.length; i++) {
      hz = i * binHz;
      v = data[i];
      if (hz < 200) { low += v; lowN++; }
      else if (hz < 3500) { mid += v; midN++; }
      else if (hz < 8000) { high += v; highN++; }
    }
    low = lowN ? low / lowN : 0;
    mid = midN ? mid / midN : 0;
    high = highN ? high / highN : 0;

    // Display level 0-100
    var rmsLevel = Math.min(100, rms * 200);
    var fftLevel = Math.min(100, ((mid * 0.65 + high * 0.25 + low * 0.1) / 255) * 150);
    var level = Math.max(rmsLevel, fftLevel * 0.9);
    audio.level = level;

    // Slow ambient baseline (only learn when not loud)
    if (level < audio.baseline + 8) {
      audio.baseline = audio.baseline * 0.96 + level * 0.04;
    }

    // sensitivity 15..95 → how far above baseline + absolute floor
    // More conservative than previous version
    var margin = 28 - (state.sensitivity / 100) * 16; // sens95→12, sens55→19, sens15→26
    var absFloor = 28 - (state.sensitivity / 100) * 10; // 18..28
    var triggerAt = Math.max(absFloor, audio.baseline + margin);
    var now = Date.now();

    // Track rising edge using previous level
    if (typeof audio.prevLevel !== 'number') audio.prevLevel = level;
    var rise = level - audio.prevLevel;
    audio.prevLevel = level * 0.6 + audio.prevLevel * 0.4; // light smooth for next rise

    if (state.auto && audio.listening) {
      // Cough-like spectral shape: mid energy meaningful vs low rumble
      var midOk = mid > 28 && mid > low * 0.85;
      // Strong enough absolute + above adaptive trigger
      var loudOk = level >= triggerAt;
      // Prefer sudden onset (not gradual background)
      var onsetOk = rise > (3.5 - state.sensitivity / 50) || level > audio.baseline + margin + 6;

      if (loudOk && midOk && onsetOk) {
        if (!audio.aboveSince) {
          audio.aboveSince = now;
          audio.peak = level;
        } else if (level > audio.peak) {
          audio.peak = level;
        }
      } else if (audio.aboveSince) {
        var held = now - audio.aboveSince;
        // Burst length: cough ~40–500ms. Longer = speech/noise.
        var shortBurst = held >= 40 && held <= 520;
        var strongEnough = audio.peak >= triggerAt + 2;
        // Must have dropped (burst ended) — continuous noise won't drop
        var dropped = level < audio.peak * 0.72 && level < triggerAt;
        if (shortBurst && strongEnough && dropped && now - audio.lastCoughAt >= state.cooldown) {
          audio.lastCoughAt = now;
          audio.aboveSince = 0;
          audio.peak = 0;
          registerCough('auto');
        } else if (held > 520 || level < audio.baseline + 4) {
          // too long or back to quiet without qualifying — discard
          audio.aboveSince = 0;
          audio.peak = 0;
        }
      }

      // timeout stuck "above" state
      if (audio.aboveSince && now - audio.aboveSince > 700) {
        audio.aboveSince = 0;
        audio.peak = 0;
      }

      audio.debug = 'L' + Math.round(level) + ' need≥' + Math.round(triggerAt) + ' base' + Math.round(audio.baseline) + (audio.aboveSince ? ' BURST' : '');
    }

    var fill = document.getElementById('levelFill');
    if (fill) fill.style.width = Math.min(100, level).toFixed(1) + '%';
    var lvl = document.getElementById('levelVal');
    if (lvl) lvl.textContent = Math.round(level) + '%';
    var trig = document.getElementById('trigVal');
    if (trig) trig.textContent = Math.round(triggerAt);
    var dbg = document.getElementById('micDebug');
    if (dbg) dbg.textContent = audio.debug || '';

    audio.raf = requestAnimationFrame(loopAudio);
  }

  function registerCough(source) {
    state.count += 1;
    state.source = source === 'auto' ? 'auto' : 'manual';
    state.updatedAt = Date.now();
    lastFlash = Date.now();
    writeUrl();
    pushLog((source === 'auto' ? 'Auto' : 'Manual') + ' cough → ' + state.count);
    paintLiveNumbers();
    var card = document.querySelector('.ov-card');
    if (card) {
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
    }
    schedulePublish(source === 'auto' ? 'auto-cough' : 'manual-cough');
  }

  function adjustCount(delta) {
    state.count = Math.max(0, state.count + delta);
    state.source = 'manual';
    state.updatedAt = Date.now();
    writeUrl();
    pushLog((delta > 0 ? 'Manual +' : 'Manual ') + delta + ' → ' + state.count);
    paintLiveNumbers();
    schedulePublish(delta >= 0 ? 'manual-cough' : 'undo');
    if (!document.getElementById('countNum')) render();
  }

  function paintLiveNumbers() {
    var n = document.getElementById('countNum');
    if (n) n.textContent = String(state.count);
    var ov = document.getElementById('ovCount');
    if (ov) ov.textContent = String(state.count);
    var cph = coughsPerHour(state.count, state.sessionStart);
    var a = document.getElementById('cphVal');
    if (a) a.textContent = cph;
    var b = document.getElementById('ovCph');
    if (b) b.textContent = cph;
    var urlBox = document.getElementById('urlBox');
    if (urlBox) urlBox.value = obsUrl();
  }

  function obsUrl() {
    var u = new URL(location.origin + location.pathname);
    u.searchParams.set('mode', 'overlay');
    if (state.room) u.searchParams.set('room', state.room);
    u.searchParams.set('count', String(state.count));
    u.searchParams.set('label', state.label);
    u.searchParams.set('sessionStart', String(state.sessionStart));
    return u.toString();
  }

  function renderOverlay() {
    document.body.className = 'overlay-mode';
    document.documentElement.style.background = 'transparent';
    var app = document.getElementById('app');
    var elapsed = formatDuration(Date.now() - state.sessionStart * 1000);
    var syncTxt = !state.room ? 'LOCAL' : (syncStatus === 'ok' ? 'LIVE' : (syncStatus === 'wait' ? 'WAIT' : (syncStatus === 'error' ? 'SYNC?' : 'SYNC')));
    var flash = (Date.now() - lastFlash < 450) ? ' flash' : '';
    app.innerHTML =
      '<div class="ov"><div class="ov-card' + flash + '">' +
      '<div class="ov-top"><span>' + escapeHtml(state.label) + '</span><span>' + syncTxt + '</span></div>' +
      '<div class="ov-count" id="ovCount">' + state.count + '</div>' +
      '<div class="ov-meta"><span>Session <b id="ovElapsed">' + elapsed + '</b></span>' +
      '<span>Per hour <b id="ovCph">' + coughsPerHour(state.count, state.sessionStart) + '</b></span></div>' +
      (state.room ? '' : '<div class="ov-hint">No room in URL — create Live room on control page</div>') +
      '</div></div>';
  }

  function renderControl() {
    document.body.className = '';
    document.documentElement.style.background = '';
    var app = document.getElementById('app');
    var elapsed = formatDuration(Date.now() - state.sessionStart * 1000);
    var need = Math.round(Math.max(18, 28 - (state.sensitivity / 100) * 10)); // initial abs floor estimate
    var roomBox = state.room
      ? ('<div class="okbox"><strong>Room active.</strong> Only <em>count changes</em> sync (not every slider move), so the free host is less likely to rate-limit.<br>Room id: <span class="room-code">' +
         escapeHtml(state.room) +
         '</span><br><span class="hint">If pill says Sync pause, wait ~15s — count still works locally, then retries.</span></div>')
      : '<p class="hint" style="margin-top:0">Create a room, paste the overlay URL into OBS, keep this page open with the mic on.</p>';

    app.innerHTML =
      '<div class="wrap">' +
      '<header class="app-head"><div class="brand">' +
      '<h1>Cough Counter</h1>' +
      '<p>Enable mic here. Create a <strong>Live room</strong> so the OBS overlay updates when coughs are counted.</p>' +
      '</div><span class="badge">Manual · Mic · Live sync</span></header>' +

      '<section class="card" style="margin-bottom:14px">' +
      '<h2>Live room (control → OBS)</h2>' +
      roomBox +
      '<div class="row">' +
      '<button type="button" class="btn accent" id="btnRoom">' + (state.room ? 'Create new room' : 'Create live room') + '</button>' +(state.room ? '<button type="button" class="btn danger" id="btnEndRoom">End room</button>' : '') +
      '<button type="button" class="btn ghost" id="btnCopy">Copy overlay URL</button>' +
      '<button type="button" class="btn ghost" id="btnOpenOv">Open overlay</button>' +
      '<button type="button" class="btn ghost sm" id="btnForceSync">Push count now</button>' +
      '<span class="status-pill" id="syncPill">Sync off</span>' +
      '</div>' +
      '<label class="field" style="margin-top:10px">OBS overlay URL<textarea class="url-box" id="urlBox" readonly>' +
      escapeHtml(obsUrl()) +
      '</textarea></label>' +
      '<p class="hint">OBS Browser Source · Width 500 · Height 320 · Transparent · URL must include room=</p>' +
      '</section>' +

      '<div class="grid">' +
      '<section class="card">' +
      '<h2>Counter</h2>' +
      '<div class="big-count"><div class="label">' + escapeHtml(state.label) + '</div><div class="num" id="countNum">' + state.count + '</div></div>' +
      '<div class="row" style="justify-content:center">' +
      '<button type="button" class="btn danger" id="btnMinus">−1</button>' +
      '<button type="button" class="btn ok" id="btnPlus">+1 Cough</button>' +
      '<button type="button" class="btn ghost" id="btnReset">Reset</button>' +
      '</div>' +
      '<div class="stat-grid">' +
      '<div class="stat"><div class="k">Session</div><div class="v" id="elapsedVal">' + elapsed + '</div></div>' +
      '<div class="stat"><div class="k">Per hour</div><div class="v" id="cphVal">' + coughsPerHour(state.count, state.sessionStart) + '</div></div>' +
      '<div class="stat"><div class="k">Last local</div><div class="v" style="font-size:1.05rem">' +
      (audio.lastCoughAt ? new Date(audio.lastCoughAt).toLocaleTimeString() : '—') +
      '</div></div></div>' +
      '<div class="row" style="margin-top:12px">' +
      '<span class="status-pill' + (audio.listening ? ' on' : '') + '">' + (audio.listening ? 'Mic live' : 'Mic off') + '</span>' +
      '<span class="status-pill' + (state.auto ? ' hot' : '') + '">' + (state.auto ? 'Auto on' : 'Auto off') + '</span>' +
      '<span class="hint">Hotkeys: Space/+ cough · − undo · R reset</span>' +
      '</div></section>' +

      '<section class="card">' +
      '<h2>Mic auto-detect (this page)</h2>' +
      '<label class="toggle"><input type="checkbox" id="autoToggle"' + (state.auto ? ' checked' : '') + ' /> Enable auto cough detection</label>' +
      '<div class="row" style="margin-top:10px">' +
      '<button type="button" class="btn accent" id="btnMic">' + (audio.listening ? 'Stop mic' : 'Enable mic') + '</button>' +
      '<button type="button" class="btn ghost sm" id="btnTest">Force +1</button>' +
      '</div>' +
      '<div class="meter-wrap" style="margin-top:10px">' +
      '<div class="meter"><i id="levelFill" style="width:' + audio.level.toFixed(1) + '%"></i></div>' +
      '<div class="meter-labels"><span>Level <span id="levelVal">' + Math.round(audio.level) + '%</span></span><span>Trigger ≥ <span id="trigVal">' + need + '</span>%</span></div>' +
      '</div>' +
      '<div class="row"><label class="field">Sensitivity (higher = more sensitive)<input id="sens" type="range" min="15" max="95" value="' + state.sensitivity + '" /></label></div>' +
      '<div class="row"><label class="field">Cooldown ms<input id="cool" type="range" min="500" max="4000" step="100" value="' + state.cooldown + '" /></label></div>' +
      '<p class="hint" style="margin:8px 0 0">Counts short loud bursts only (rise + mid energy + drop). Ambient chatter should not count. If quiet coughs miss: raise sensitivity. If random noise counts: lower sensitivity / raise cooldown.</p>' +
      (audio.error ? ('<div class="warn">Mic error: ' + escapeHtml(audio.error) + '</div>') : '') +
      '</section></div>' +

      '<section class="card" style="margin-top:14px">' +
      '<h2>Session / label</h2>' +
      '<div class="row">' +
      '<label class="field">Label<input id="labelInput" type="text" maxlength="18" value="' + escapeHtml(state.label) + '" /></label>' +
      '<button type="button" class="btn ghost" id="btnNewSession">New session timer</button>' +
      '<button type="button" class="btn ghost" id="btnNewSessionReset">New session + reset</button>' +
      '</div></section>' +

      '<section class="card" style="margin-top:14px">' +
      '<h2>Event log</h2>' +
      '<div class="log" id="eventLog">' +
      (logLines.length ? logLines.map(function (l) { return '<div>' + escapeHtml(l) + '</div>'; }).join('') : '<div>No events yet</div>') +
      '</div></section>' +
      '<footer class="note">Client-side mic · Count-only live sync · <a href="https://github.com/FranklinElliott/cough-counter">GitHub</a></footer>' +
      '</div>';

    wireControl();
    updateSyncPill();
  }

  function wireControl() {
    document.getElementById('btnPlus').onclick = function () { adjustCount(1); };
    document.getElementById('btnMinus').onclick = function () { adjustCount(-1); };
    document.getElementById('btnReset').onclick = function () {
      if (!confirm('Reset cough count to 0?')) return;
      state.count = 0;
      state.source = 'manual';
      state.updatedAt = Date.now();
      writeUrl();
      paintLiveNumbers();
      schedulePublish('reset');
      render();
    };
    document.getElementById('btnTest').onclick = function () { registerCough('manual'); };
    document.getElementById('autoToggle').onchange = async function (e) {
      state.auto = e.target.checked;
      writeUrl();
      if (state.auto && audio.ctx && audio.ctx.state === 'suspended') {
        try { await audio.ctx.resume(); } catch (err) {}
      }
      if (state.auto && !audio.listening) {
        toast('Enable mic to use auto-detect');
      }
      render();
    };
    document.getElementById('btnMic').onclick = async function () {
      if (audio.listening) {
        stopMic();
        pushLog('Mic stopped');
        render();
      } else {
        if (!state.room) toast('Create a live room first for OBS sync');
        await startMic();
      }
    };
    document.getElementById('sens').oninput = function (e) {
      state.sensitivity = parseInt(e.target.value, 10);
      var need = Math.round(Math.max(18, 28 - (state.sensitivity / 100) * 10)); // initial abs floor estimate
      var labels = document.querySelector('.meter-labels span:last-child');
      if (labels) labels.textContent = 'Trigger ≥ <span id="trigVal">' + need + '</span>%';
      saveLocal();
    };
    document.getElementById('cool').oninput = function (e) {
      state.cooldown = parseInt(e.target.value, 10);
      saveLocal();
    };
    document.getElementById('labelInput').onchange = function (e) {
      state.label = e.target.value.trim().slice(0, 18) || 'COUGHS';
      state.updatedAt = Date.now();
      writeUrl();
      schedulePublish('label');
      render();
    };
    document.getElementById('btnNewSession').onclick = function () {
      state.sessionStart = Math.floor(Date.now() / 1000);
      state.updatedAt = Date.now();
      writeUrl();
      schedulePublish('session');
      toast('New session timer');
      render();
    };
    document.getElementById('btnNewSessionReset').onclick = function () {
      state.sessionStart = Math.floor(Date.now() / 1000);
      state.count = 0;
      state.updatedAt = Date.now();
      writeUrl();
      schedulePublish('session-reset');
      toast('Session + count reset');
      render();
    };
    var endBtn = document.getElementById('btnEndRoom');
    if (endBtn) {
      endBtn.onclick = function () { endRoom(); };
    }
    document.getElementById('btnRoom').onclick = async function () {
      if (state.room && !confirm('Create a brand new room? Update OBS with the new overlay URL.')) return;
      await createRoom();
    };
    document.getElementById('btnForceSync').onclick = function () {
      if (!state.room) { toast('Create a live room first'); return; }
      state.updatedAt = Date.now();
      publishNow('manual-push');
      toast('Pushing count…');
    };
    document.getElementById('btnCopy').onclick = async function () {
      if (!state.room) { toast('Create a live room first'); return; }
      try {
        await navigator.clipboard.writeText(obsUrl());
        toast('Overlay URL copied');
      } catch (e) {
        document.getElementById('urlBox').select();
        toast('Copy from the box');
      }
    };
    document.getElementById('btnOpenOv').onclick = function () {
      if (!state.room) { toast('Create a live room first'); return; }
      window.open(obsUrl(), '_blank');
    };
  }

  function render() {
    if (state.mode === 'overlay') renderOverlay();
    else renderControl();
  }

  window.addEventListener('keydown', function (e) {
    if (state.mode === 'overlay') return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'Space' || e.key === '+' || e.key === '=') {
      e.preventDefault();
      adjustCount(1);
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      adjustCount(-1);
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      if (confirm('Reset cough count to 0?')) {
        state.count = 0;
        state.updatedAt = Date.now();
        writeUrl();
        schedulePublish('reset');
        render();
      }
    }
  });

  function startTicks() {
    clearInterval(tickTimer);
    tickTimer = setInterval(function () {
      var elapsed = formatDuration(Date.now() - state.sessionStart * 1000);
      var a = document.getElementById('elapsedVal');
      if (a) a.textContent = elapsed;
      var b = document.getElementById('ovElapsed');
      if (b) b.textContent = elapsed;
      var cph = coughsPerHour(state.count, state.sessionStart);
      var c = document.getElementById('cphVal');
      if (c) c.textContent = cph;
      var d = document.getElementById('ovCph');
      if (d) d.textContent = cph;
      updateSyncPill();
    }, 500);
  }

  function boot() {
    readUrlIntoState();
    writeUrl();
    render();
    startTicks();
    if (state.mode === 'overlay' && state.room) startPolling();
  }

  boot();
})();

  
  
  
  </script>
</body>
